name: Build Installer

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --yes

      - name: Install Inno Setup
        run: choco install innosetup --yes

      - name: Install IDP plugin
        run: |$idpFetchAddress = "https://github.com/PeterDaveHello/inno-download-plugin/releases/download/v1.5.1/idpsetup-1.5.1.exe"
          Invoke-WebRequest -Uri $idpUrl -OutFile "$env:TEMP\idpsetup-1.5.1.exe"
          Start-Process -FilePath "$env:TEMP\idpsetup-1.5.1.exe" -ArgumentList "/VERYSILENT" -Wait
        shell: powershell

      - name: Compile installer
        run: iscc /DAppVersion=${{ github.ref_name }} installer/setup.iss

      - name: Compile installer
        run: iscc /DAppVersion=${{ github.ref_name }} Installers/Windows/Eugene-v0.513.iss

      - name: Upload installer to Release
        uses: softprops/action-gh-release@v2
        with:
          files: Output/Eugene-v0.513.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}